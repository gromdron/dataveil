version: 1.0

database:
    source: "bitrix_settings"
    bitrix:
        settings_file: "/home/bitrix/www/bitrix/.settings.php"
        connection_name: "default"

settings:
  secret_key: "change-me-in-production"

strategies:
    # ============================================================
    # БАЗОВЫЕ ТИПЫ
    # ============================================================
    - name: "empty"
      type: "empty"

    - name: "email_fake"
      type: "email_fake"

    - name: "name_fake"
      type: "name_fake"

    - name: "lastname_fake"
      type: "lastname_fake"

    - name: "phone_fake"
      type: "phone_fake"

    # ============================================================
    # СТРОКИ БЕЗ ПРЕФИКСА (для адресов, полей, кодов)
    # ============================================================
    - name: "str_4"
      type: "string_random"
      options: { length: 4, prefix: "" }

    - name: "str_5"
      type: "string_random"
      options: { length: 5, prefix: "" }

    - name: "str_6"
      type: "string_random"
      options: { length: 6, prefix: "" }

    - name: "str_8"
      type: "string_random"
      options: { length: 8, prefix: "" }

    - name: "str_9"
      type: "string_random"
      options: { length: 9, prefix: "" }

    - name: "str_10"
      type: "string_random"
      options: { length: 10, prefix: "" }

    - name: "str_11"
      type: "string_random"
      options: { length: 11, prefix: "" }

    - name: "str_12"
      type: "string_random"
      options: { length: 12, prefix: "" }

    - name: "str_13"
      type: "string_random"
      options: { length: 13, prefix: "" }

    - name: "str_15"
      type: "string_random"
      options: { length: 15, prefix: "" }

    - name: "str_16"
      type: "string_random"
      options: { length: 16, prefix: "" }

    - name: "str_20"
      type: "string_random"
      options: { length: 20, prefix: "" }

    # ============================================================
    # СТРОКИ С ПРЕФИКСОМ (для осмысленных значений)
    # ============================================================
    - name: "ip_private"
      type: "string_random"
      options: { length: 8, prefix: "192.168." }

    - name: "user_login"
      type: "string_random"
      options: { length: 10, prefix: "user_" }

    - name: "company"
      type: "string_random"
      options: { length: 10, prefix: "Company_" }

    - name: "dept"
      type: "string_random"
      options: { length: 8, prefix: "Dept_" }

    - name: "www"
      type: "string_random"
      options: { length: 12, prefix: "www." }

    - name: "chat_title"
      type: "string_random"
      options: { length: 10, prefix: "Chat_" }

    - name: "client"
      type: "string_random"
      options: { length: 10, prefix: "Client_" }

    - name: "group"
      type: "string_random"
      options: { length: 10, prefix: "Group_" }

    - name: "mail_login"
      type: "string_random"
      options: { length: 10, prefix: "mail_" }

    - name: "msg"
      type: "string_random"
      options: { length: 10, prefix: "Msg_" }

    - name: "pm"
      type: "string_random"
      options: { length: 10, prefix: "PM_" }

    - name: "post"
      type: "string_random"
      options: { length: 10, prefix: "Post_" }

    - name: "req"
      type: "string_random"
      options: { length: 10, prefix: "Req_" }

    - name: "activity"
      type: "string_random"
      options: { length: 12, prefix: "Activity_" }

    - name: "bank"
      type: "string_random"
      options: { length: 12, prefix: "Bank_" }

    - name: "bptask"
      type: "string_random"
      options: { length: 12, prefix: "BPTask_" }

    - name: "deal"
      type: "string_random"
      options: { length: 12, prefix: "Deal_" }

    - name: "doc"
      type: "string_random"
      options: { length: 12, prefix: "Doc_" }

    - name: "event"
      type: "string_random"
      options: { length: 12, prefix: "Event_" }

    - name: "item"
      type: "string_random"
      options: { length: 12, prefix: "Item_" }

    - name: "lead"
      type: "string_random"
      options: { length: 12, prefix: "Lead_" }

    - name: "quote"
      type: "string_random"
      options: { length: 12, prefix: "Quote_" }

    - name: "task"
      type: "string_random"
      options: { length: 12, prefix: "Task_" }

    - name: "ticket"
      type: "string_random"
      options: { length: 12, prefix: "Ticket_" }

    - name: "llc"
      type: "string_random"
      options: { length: 15, prefix: "LLC " }

    - name: "re"
      type: "string_random"
      options: { length: 15, prefix: "Re: " }

    - name: "note"
      type: "string_random"
      options: { length: 20, prefix: "Note_" }

    - name: "emp_code"
      type: "string_random"
      options: { length: 8, prefix: "EMP_" }

    - name: "pers_code"
      type: "string_random"
      options: { length: 8, prefix: "PERS_" }

    - name: "file_name"
      type: "string_random"
      options: { length: 8, prefix: "file_" }

rules:
    tables:
        # ============================================================
        # СИСТЕМНЫЕ ТАБЛИЦЫ
        # ============================================================

        # Поисковые индексы (безопасно удалить, перестроятся)
        - name: "b_search_content"
          action: "truncate"
          comment: "Поисковый индекс"

        # События (почтовые уведомления содержат PII)
        - name: "b_event"
          action: "update"
          fields:
              - column: "C_FIELDS"
                strategy: "empty"

        # ============================================================
        # ПОЛЬЗОВАТЕЛИ
        # ============================================================

        - name: "b_user"
          action: "update"
          fields:
              - column: "EMAIL"
                strategy: "email_fake"
                salt_source: "primary"
              - column: "LOGIN"
                strategy: "user_login"
                salt_source: "primary"
              - column: "NAME"
                strategy: "name_fake"
                salt_source: "primary"
              - column: "LAST_NAME"
                strategy: "lastname_fake"
                salt_source: "primary"
              - column: "SECOND_NAME"
                strategy: "name_fake"
                salt_source: "primary"
              - column: "PERSONAL_PHONE"
                strategy: "phone_fake"
                salt_source: "primary"
              - column: "PERSONAL_MOBILE"
                strategy: "phone_fake"
                salt_source: "primary"
              - column: "PERSONAL_FAX"
                strategy: "phone_fake"
                salt_source: "primary"
              - column: "PERSONAL_STREET"
                strategy: "str_15"
                salt_source: "primary"
              - column: "PERSONAL_CITY"
                strategy: "str_8"
                salt_source: "primary"
              - column: "PERSONAL_STATE"
                strategy: "str_8"
                salt_source: "primary"
              - column: "PERSONAL_ZIP"
                strategy: "str_6"
                salt_source: "primary"
              - column: "PERSONAL_NOTES"
                strategy: "empty"
              - column: "WORK_COMPANY"
                strategy: "company"
                salt_source: "primary"
              - column: "WORK_DEPARTMENT"
                strategy: "dept"
                salt_source: "primary"
              - column: "WORK_POSITION"
                strategy: "str_10"
                salt_source: "primary"
              - column: "WORK_PHONE"
                strategy: "phone_fake"
                salt_source: "primary"
              - column: "WORK_FAX"
                strategy: "phone_fake"
                salt_source: "primary"
              - column: "WORK_STREET"
                strategy: "str_15"
                salt_source: "primary"
              - column: "WORK_CITY"
                strategy: "str_8"
                salt_source: "primary"
              - column: "WORK_NOTES"
                strategy: "empty"
              - column: "ADMIN_NOTES"
                strategy: "empty"
              - column: "PERSONAL_WWW"
                strategy: "www"
                salt_source: "primary"
              - column: "WORK_WWW"
                strategy: "www"
                salt_source: "primary"
              - column: "STORED_HASH"
                strategy: "empty"
              - column: "CHECKWORD"
                strategy: "empty"
              - column: "CONFIRM_CODE"
                strategy: "empty"
              - column: "PERSONAL_BIRTHDATE"
                strategy: "empty"
              - column: "PERSONAL_BIRTHDAY"
                strategy: "empty"
              - column: "PERSONAL_GENDER"
                strategy: "empty"
              - column: "PERSONAL_COUNTRY"
                strategy: "str_8"
                salt_source: "primary"
              - column: "PERSONAL_ICQ"
                strategy: "str_8"
                salt_source: "primary"
              - column: "WORK_PROFILE"
                strategy: "empty"
              - column: "PERSONAL_PAGER"
                strategy: "str_8"
                salt_source: "primary"
              - column: "WORK_PAGER"
                strategy: "str_8"
                salt_source: "primary"
          where: "ID NOT IN (1)"

        # Пароли приложений
        - name: "b_app_password"
          action: "update"
          fields:
              - column: "PASSWORD"
                strategy: "empty"
              - column: "DIGEST_PASSWORD"
                strategy: "empty"
              - column: "LAST_IP"
                strategy: "ip_private"
                salt_source: "primary"

        # ============================================================
        # CRM
        # ============================================================

        # Сделки
        - name: "b_crm_deal"
          action: "update"
          fields:
              - column: "TITLE"
                strategy: "deal"
                salt_source: "primary"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "SOURCE_DESCRIPTION"
                strategy: "empty"
              - column: "ADDITIONAL_INFO"
                strategy: "empty"

        # Лиды
        - name: "b_crm_lead"
          action: "update"
          fields:
              - column: "NAME"
                strategy: "name_fake"
                salt_source: "primary"
              - column: "LAST_NAME"
                strategy: "lastname_fake"
                salt_source: "primary"
              - column: "SECOND_NAME"
                strategy: "name_fake"
                salt_source: "primary"
              - column: "FULL_NAME"
                strategy: "str_15"
                salt_source: "primary"
              - column: "TITLE"
                strategy: "lead"
                salt_source: "primary"
              - column: "POST"
                strategy: "str_10"
                salt_source: "primary"
              - column: "ADDRESS"
                strategy: "str_15"
                salt_source: "primary"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "SOURCE_DESCRIPTION"
                strategy: "empty"
              - column: "COMPANY_TITLE"
                strategy: "company"
                salt_source: "primary"
              - column: "BIRTHDATE"
                strategy: "empty"
              - column: "SEARCH_CONTENT"
                strategy: "empty"

        # Контакты
        - name: "b_crm_contact"
          action: "update"
          fields:
              - column: "NAME"
                strategy: "name_fake"
                salt_source: "primary"
              - column: "LAST_NAME"
                strategy: "lastname_fake"
                salt_source: "primary"
              - column: "SECOND_NAME"
                strategy: "name_fake"
                salt_source: "primary"
              - column: "FULL_NAME"
                strategy: "str_15"
                salt_source: "primary"
              - column: "POST"
                strategy: "str_10"
                salt_source: "primary"
              - column: "ADDRESS"
                strategy: "str_15"
                salt_source: "primary"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "SOURCE_DESCRIPTION"
                strategy: "empty"
              - column: "BIRTHDATE"
                strategy: "empty"
              - column: "SEARCH_CONTENT"
                strategy: "empty"

        # Компании
        - name: "b_crm_company"
          action: "update"
          fields:
              - column: "TITLE"
                strategy: "company"
                salt_source: "primary"
              - column: "ADDRESS"
                strategy: "str_15"
                salt_source: "primary"
              - column: "ADDRESS_LEGAL"
                strategy: "str_15"
                salt_source: "primary"
              - column: "BANKING_DETAILS"
                strategy: "empty"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "REVENUE"
                strategy: "str_6"
                salt_source: "primary"
              - column: "SOURCE_DESCRIPTION"
                strategy: "empty"
              - column: "SEARCH_CONTENT"
                strategy: "empty"

        # Котировки
        - name: "b_crm_quote"
          action: "update"
          fields:
              - column: "TITLE"
                strategy: "quote"
                salt_source: "primary"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "CONTENT"
                strategy: "empty"
              - column: "TERMS"
                strategy: "empty"
              - column: "CLIENT_TITLE"
                strategy: "client"
                salt_source: "primary"
              - column: "CLIENT_ADDR"
                strategy: "str_15"
                salt_source: "primary"
              - column: "CLIENT_CONTACT"
                strategy: "name_fake"
                salt_source: "primary"
              - column: "CLIENT_EMAIL"
                strategy: "email_fake"
                salt_source: "primary"
              - column: "CLIENT_PHONE"
                strategy: "phone_fake"
                salt_source: "primary"

        # Активности
        - name: "b_crm_act"
          action: "update"
          fields:
              - column: "SUBJECT"
                strategy: "activity"
                salt_source: "primary"
              - column: "DESCRIPTION"
                strategy: "empty"
              - column: "LOCATION"
                strategy: "str_10"
                salt_source: "primary"
              - column: "PROVIDER_PARAMS"
                strategy: "empty"
              - column: "PROVIDER_DATA"
                strategy: "empty"
              - column: "SEARCH_CONTENT"
                strategy: "empty"

        # Связь активностей
        - name: "b_crm_act_comm"
          action: "update"
          fields:
              - column: "VALUE"
                strategy: "str_10"
                salt_source: "primary"

        # Тела писем активностей
        - name: "b_crm_act_mail_body"
          action: "update"
          fields:
              - column: "BODY"
                strategy: "empty"

        # Метаданные писем активностей
        - name: "b_crm_act_mail_meta"
          action: "update"
          fields:
              - column: "FROM"
                strategy: "email_fake"
                salt_source: "primary"
              - column: "TO"
                strategy: "email_fake"
                salt_source: "primary"
              - column: "CC"
                strategy: "email_fake"
                salt_source: "primary"
              - column: "BCC"
                strategy: "email_fake"
                salt_source: "primary"
              - column: "SUBJECT"
                strategy: "re"
                salt_source: "primary"
              - column: "MSG_ID_HASH"
                strategy: "empty"
              - column: "MSG_INREPLY_HASH"
                strategy: "empty"
              - column: "MSG_HEADER_HASH"
                strategy: "empty"

        # Реквизиты
        - name: "b_crm_requisite"
          action: "update"
          fields:
              - column: "NAME"
                strategy: "req"
                salt_source: "primary"
              - column: "RQ_NAME"
                strategy: "str_10"
                salt_source: "primary"
              - column: "RQ_FIRST_NAME"
                strategy: "name_fake"
                salt_source: "primary"
              - column: "RQ_LAST_NAME"
                strategy: "lastname_fake"
                salt_source: "primary"
              - column: "RQ_SECOND_NAME"
                strategy: "name_fake"
                salt_source: "primary"
              - column: "RQ_COMPANY_NAME"
                strategy: "company"
                salt_source: "primary"
              - column: "RQ_COMPANY_FULL_NAME"
                strategy: "llc"
                salt_source: "primary"
              - column: "RQ_DIRECTOR"
                strategy: "name_fake"
                salt_source: "primary"
              - column: "RQ_ACCOUNTANT"
                strategy: "name_fake"
                salt_source: "primary"
              - column: "RQ_CEO_NAME"
                strategy: "name_fake"
                salt_source: "primary"
              - column: "RQ_CONTACT"
                strategy: "name_fake"
                salt_source: "primary"
              - column: "RQ_EMAIL"
                strategy: "email_fake"
                salt_source: "primary"
              - column: "RQ_PHONE"
                strategy: "phone_fake"
                salt_source: "primary"
              - column: "RQ_FAX"
                strategy: "phone_fake"
                salt_source: "primary"
              - column: "RQ_IDENT_DOC_SER"
                strategy: "str_4"
                salt_source: "primary"
              - column: "RQ_IDENT_DOC_NUM"
                strategy: "str_6"
                salt_source: "primary"
              - column: "RQ_IDENT_DOC_PERS_NUM"
                strategy: "str_12"
                salt_source: "primary"
              - column: "RQ_IDENT_DOC_ISSUED_BY"
                strategy: "str_15"
                salt_source: "primary"
              - column: "RQ_INN"
                strategy: "str_10"
                salt_source: "primary"
              - column: "RQ_KPP"
                strategy: "str_9"
                salt_source: "primary"
              - column: "RQ_OGRN"
                strategy: "str_13"
                salt_source: "primary"
              - column: "RQ_OGRNIP"
                strategy: "str_15"
                salt_source: "primary"
              - column: "RQ_OKPO"
                strategy: "str_10"
                salt_source: "primary"
              - column: "RQ_OKVED"
                strategy: "str_8"
                salt_source: "primary"
              - column: "RQ_EDRPOU"
                strategy: "str_8"
                salt_source: "primary"
              - column: "RQ_DRFO"
                strategy: "str_10"
                salt_source: "primary"
              - column: "RQ_IIN"
                strategy: "str_12"
                salt_source: "primary"
              - column: "RQ_BIN"
                strategy: "str_12"
                salt_source: "primary"

        # Банковские реквизиты
        - name: "b_crm_bank_detail"
          action: "update"
          fields:
              - column: "RQ_BANK_NAME"
                strategy: "bank"
                salt_source: "primary"
              - column: "RQ_BANK_ADDR"
                strategy: "str_15"
                salt_source: "primary"
              - column: "RQ_BANK_ROUTE_NUM"
                strategy: "str_9"
                salt_source: "primary"
              - column: "RQ_BIK"
                strategy: "str_9"
                salt_source: "primary"
              - column: "RQ_MFO"
                strategy: "str_6"
                salt_source: "primary"
              - column: "RQ_ACC_NAME"
                strategy: "str_10"
                salt_source: "primary"
              - column: "RQ_ACC_NUM"
                strategy: "str_20"
                salt_source: "primary"
              - column: "RQ_IIK"
                strategy: "str_20"
                salt_source: "primary"
              - column: "RQ_COR_ACC_NUM"
                strategy: "str_20"
                salt_source: "primary"
              - column: "RQ_IBAN"
                strategy: "str_20"
                salt_source: "primary"
              - column: "RQ_SWIFT"
                strategy: "str_11"
                salt_source: "primary"
              - column: "RQ_BIC"
                strategy: "str_11"
                salt_source: "primary"
              - column: "RQ_CODEB"
                strategy: "str_5"
                salt_source: "primary"
              - column: "RQ_CODEG"
                strategy: "str_5"
                salt_source: "primary"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "RQ_BANK_CODE"
                strategy: "str_10"
                salt_source: "primary"
              - column: "RQ_AGENCY_NAME"
                strategy: "str_10"
                salt_source: "primary"

        # Заметки таймлайна
        - name: "b_crm_timeline_note"
          action: "update"
          fields:
              - column: "TEXT"
                strategy: "note"
                salt_source: "primary"

        # Таймлайн
        - name: "b_crm_timeline"
          action: "update"
          fields:
              - column: "COMMENT"
                strategy: "empty"

        # Адреса CRM
        - name: "b_crm_addr"
          action: "update"
          fields:
              - column: "ADDRESS_1"
                strategy: "str_15"
                salt_source: "primary"
              - column: "ADDRESS_2"
                strategy: "str_15"
                salt_source: "primary"
              - column: "CITY"
                strategy: "str_8"
                salt_source: "primary"
              - column: "POSTAL_CODE"
                strategy: "str_6"
                salt_source: "primary"
              - column: "REGION"
                strategy: "str_8"
                salt_source: "primary"
              - column: "PROVINCE"
                strategy: "str_8"
                salt_source: "primary"

        # События CRM
        - name: "b_crm_event"
          action: "update"
          fields:
              - column: "DESCRIPTION"
                strategy: "empty"
              - column: "SETTINGS"
                strategy: "empty"
              - column: "EVENT_TEXT_1"
                strategy: "empty"
              - column: "EVENT_TEXT_2"
                strategy: "empty"

        # Инвойсы CRM
        - name: "b_crm_invoice"
          action: "update"
          fields:
              - column: "USER_DESCRIPTION"
                strategy: "empty"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "PS_STATUS_DESCRIPTION"
                strategy: "empty"
              - column: "PS_STATUS_MESSAGE"
                strategy: "empty"
              - column: "SEARCH_CONTENT"
                strategy: "empty"

        # Свойства корзины инвойсов
        - name: "b_crm_invoice_basket_props"
          action: "update"
          fields:
              - column: "NAME"
                strategy: "str_10"
                salt_source: "primary"
              - column: "VALUE"
                strategy: "str_10"
                salt_source: "primary"

        # Значения свойств инвойсов
        - name: "b_crm_invoice_props_value"
          action: "update"
          fields:
              - column: "NAME"
                strategy: "str_10"
                salt_source: "primary"
              - column: "VALUE"
                strategy: "str_10"
                salt_source: "primary"

        # Смарт-процесс 31
        - name: "b_crm_dynamic_items_31"
          action: "update"
          fields:
              - column: "TITLE"
                strategy: "item"
                salt_source: "primary"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "SOURCE_DESCRIPTION"
                strategy: "empty"

        # Смарт-процесс 36
        - name: "b_crm_dynamic_items_36"
          action: "update"
          fields:
              - column: "TITLE"
                strategy: "item"
                salt_source: "primary"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "SOURCE_DESCRIPTION"
                strategy: "empty"

        # Смарт-процесс 39
        - name: "b_crm_dynamic_items_39"
          action: "update"
          fields:
              - column: "TITLE"
                strategy: "item"
                salt_source: "primary"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "SOURCE_DESCRIPTION"
                strategy: "empty"

        # ============================================================
        # ИНТЕРНЕТ-МАГАЗИН (b_sale)
        # ============================================================

        # Заказы
        - name: "b_sale_order"
          action: "update"
          fields:
              - column: "USER_DESCRIPTION"
                strategy: "empty"
              - column: "COMMENTS"
                strategy: "empty"
              - column: "SEARCH_CONTENT"
                strategy: "empty"

        # Значения свойств заказов (EAV — содержит email, телефоны, ФИО, адреса)
